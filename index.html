<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Pro - Sistema en Vivo</title>
    <style>
        :root { --primary: #0284c7; --primary-dark: #1e3a8a; --success: #16a34a; --danger: #dc2626; --warning: #d97706; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Pantalla de Selección de Rol */
        #pantalla-rol { display: flex; justify-content: center; align-items: center; height: 90vh; }
        .card-rol { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 100%; border-top: 5px solid #0284c7; color: white; }
        .card-rol h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
        .card-rol p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        .btn-rol { display: block; width: 100%; padding: 14px; margin-bottom: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: opacity 0.2s; }
        
        /* Estilos Generales Paneles */
        header { background: var(--card); padding: 20px 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.3rem; }
        #toast { position: fixed; top: 20px; right: 20px; background: #0f172a; color: white; padding: 14px 20px; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); transform: translateX(120%); transition: transform 0.3s ease; z-index: 1000; font-size: 0.9rem; border-left: 4px solid var(--primary); }
        #toast.show { transform: translateX(0); }
        
        .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .item-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        
        button { cursor: pointer; padding: 9px 14px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
        .btn-falta { background: #fee2e2; color: var(--danger); width: 100%; }
        .btn-recibido { background: #dcfce7; color: var(--success); width: 100%; }
        .btn-tramitar { background: #2563eb; color: white; }
        .btn-comprar { background: var(--success); color: white; }
        .btn-primary { background: var(--primary); color: white; }

        .status-pill { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .pill-ok { background: #dcfce7; color: var(--success); }
        .pill-falta { background: #fee2e2; color: var(--danger); }
        .pill-proceso { background: #fef3c7; color: var(--warning); }
        .pill-comprado { background: #e0f2fe; color: var(--primary); }

        .alerta-box { background: #fef2f2; border: 1px solid #fecaca; padding: 15px; border-radius: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 4px solid var(--primary); }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.9rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; }
        .btn-cambiar-rol { background: none; border: 1px solid #cbd5e1; color: #64748b; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

<div id="toast">🔔 <span id="toast-msg">Notificación</span></div>

<!-- PANTALLA DE SELECCIÓN DE ROL (Se guarda en este dispositivo) -->
<div id="pantalla-rol">
    <div class="card-rol">
        <h1>🍽️ Catering Pro</h1>
        <p>¿Qué rol tiene este dispositivo?</p>
        <button class="btn-rol" style="background:#0284c7; color:white;" onclick="fijarRol('encargado')">📦 Encargado (Almacén)</button>
        <button class="btn-rol" style="background:#16a34a; color:white;" onclick="fijarRol('jefe')">🏢 Jefe (Oficina / Dirección)</button>
    </div>
</div>

<!-- CONTENEDOR PRINCIPAL DE LA APLICACIÓN -->
<div id="app-principal" class="container" style="display: none;">
    <header>
        <div>
            <h1 id="titulo-panel">Panel</h1>
            <span style="color: var(--success); font-weight: bold; font-size: 0.85rem;">● En Vivo (Tiempo Real)</span>
        </div>
        <button class="btn-cambiar-rol" onclick="cambiarRol()">Cambiar de Rol</button>
    </header>

    <div id="contenido-dinamico"></div>
</div>

<script src="app.js"></script>
<script>
    function fijarRol(rol) {
        localStorage.setItem('catering_dispositivo_rol', rol);
        cargarPanel();
    }

    function cambiarRol() {
        localStorage.removeItem('catering_dispositivo_rol');
        document.getElementById('pantalla-rol').style.display = 'flex';
        document.getElementById('app-principal').style.display = 'none';
    }

    function cargarPanel() {
        let rol = localStorage.getItem('catering_dispositivo_rol');
        if (!rol) {
            document.getElementById('pantalla-rol').style.display = 'flex';
            document.getElementById('app-principal').style.display = 'none';
            return;
        }

        document.getElementById('pantalla-rol').style.display = 'none';
        document.getElementById('app-principal').style.display = 'block';

        if (rol === 'encargado') {
            document.getElementById('titulo-panel').innerText = "📦 Panel de Almacén";
            renderEncargado();
        } else {
            document.getElementById('titulo-panel').innerText = "🏢 Panel de Oficina & Compras";
            renderJefe();
        }
    }

    // ACCIONES COMUNES
    function cambiarEstadoItem(id, nuevoEstado, mensajeToast) {
        let db = obtenerInventario();
        let item = db.find(i => i.id === id);
        if (item) {
            item.estado = nuevoEstado;
            if (nuevoEstado === "Falta") item.veces = (item.veces || 0) + 1;
            guardarInventario(db, mensajeToast);
        }
    }

    // RENDERIZAR VISTA ENCARGADO
    function renderEncargado() {
        let db = obtenerInventario();
        let contenedor = document.getElementById('contenido-dinamico');
        
        let pendientes = db.filter(i => i.estado === "Comprado" || i.estado === "Pedido solicitado");
        let htmlBanner = "";
        
        if (pendientes.length > 0) {
            let htmlRec = "";
            pendientes.forEach(item => {
                let pill = item.estado === "Comprado" ? `<span class="status-pill pill-comprado">🚀 En Camino</span>` : `<span class="status-pill pill-proceso">⏳ En Oficina</span>`;
                let accion = item.estado === "Comprado" ? `<button class="btn-recibido" onclick="cambiarEstadoItem(${item.id}, 'OK', '✔ Almacén confirmó la llegada de: ${item.nombre}')">📦 Confirmar Recepción</button>` : `<em style="font-size:0.85rem; color:#64748b;">Esperando al jefe...</em>`;
                htmlRec += `<div style="background:white; padding:12px; border-radius:8px; border:1px solid #fef3c7; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;"><div><strong>${item.nombre}</strong><br>${pill}</div><div>${accion}</div></div>`;
            });
            htmlBanner = `<div class="card" style="background:#fffbeb; border:1px solid #fde68a;"><h3>🚚 Mercancía en Tránsito</h3>${htmlRec}</div>`;
        }

        let categorias = ["Congelados", "Frescos", "Secos", "Menaje"];
        let htmlCats = "";
        categorias.forEach(cat => {
            let itemsCat = db.filter(i => i.categoria === cat);
            if(itemsCat.length === 0) return;

            let htmlItems = "";
            itemsCat.forEach(item => {
                let pill = item.estado === "OK" ? `<span class="status-pill pill-ok">Correcto</span>` : `<span class="status-pill pill-falta">Falta Stock</span>`;
                htmlItems += `
                    <div class="item-card">
                        <div>
                            <h4 style="margin:0 0 5px 0;">${item.nombre}</h4>
                            <p style="margin:0 0 10px 0; font-size:0.8rem;">Estado: ${pill}</p>
                        </div>
                        <div>${item.estado === 'OK' ? `<button class="btn-falta" onclick="cambiarEstadoItem(${item.id}, 'Falta', '⚠️ Almacén reportó falta en: ${item.nombre}')">Marcar Falta</button>` : `<em style="font-size:0.8rem; color:#64748b;">Aviso enviado</em>`}</div>
                    </div>`;
            });
            htmlCats += `<div class="card"><h2>${cat}</h2><div class="items-grid">${htmlItems}</div></div>`;
        });

        contenedor.innerHTML = htmlBanner + htmlCats;
    }

    // RENDERIZAR VISTA JEFE
    function renderJefe() {
        let db = obtenerInventario();
        let contenedor = document.getElementById('contenido-dinamico');

        let total = db.length;
        let faltas = db.filter(i => i.estado !== "OK");
        let top = db.reduce((p, c) => (c.veces > p.veces) ? c : p, { nombre: "Ninguno", veces: 0 });

        let htmlAlertas = "";
        if (faltas.length > 0) {
            faltas.forEach(i => {
                let btn = i.estado === "Falta" ? `<button class="btn-tramitar" onclick="cambiarEstadoItem(${i.id}, 'Pedido solicitado', 'Oficina tramitó pedido de ${i.nombre}')">Tramitar Pedido</button>` : (i.estado === "Pedido solicitado" ? `<button class="btn-comprar" onclick="cambiarEstado(${i.id}, 'Comprado', 'Oficina marcó como COMPRADO: ${i.nombre}')">Marcar Comprado</button>` : `<em style="color:#64748b;">En camino...</em>`);
                htmlAlertas += `<div class="alerta-box"><div><strong>${i.nombre}</strong> (${i.categoria})<br><span style="color:var(--danger); font-weight:bold;">Estado: ${i.estado}</span></div><div>${btn}</div></div>`;
            });
        } else {
            htmlAlertas = `<p style="color: var(--success); font-weight: 600; margin:0;">✔ Todo en orden. No hay faltas reportadas.</p>`;
        }

        let htmlTabla = "";
        db.forEach(i => {
            htmlTabla += `<tr><td><strong>${i.nombre}</strong></td><td>${i.categoria}</td><td>${i.estado}</td><td><strong>${i.veces || 0} veces</strong></td></tr>`;
        });

        contenedor.innerHTML = `
            <div class="stats-grid">
                <div class="stat-card"><h3>Total Catálogo</h3><p>${total}</p></div>
                <div class="stat-card" style="border-left-color: var(--danger);"><h3>Faltas Activas</h3><p style="color: var(--danger);">${faltas.length}</p></div>
                <div class="stat-card" style="border-left-color: var(--warning);"><h3>Más Solicitado</h3><p style="font-size: 1.1rem; padding-top: 4px; color: var(--warning);">${top.veces > 0 ? top.nombre + ' (' + top.veces + 'x)' : 'Sin datos'}</p></div>
            </div>
            <div class="card"><h2>🚨 Gestión de Alertas y Compras Urgentes</h2>${htmlAlertas}</div>
            <div class="card">
                <h2>➕ Dar de Alta Nuevo Producto</h2>
                <div style="display:grid; grid-template-columns:2fr 1fr auto; gap:10px; align-items:end;">
                    <div><label style="font-size:0.8rem; font-weight:600;">Nombre</label><input type="text" id="nombreProd" placeholder="Ej. Solomillo (kg)" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;"></div>
                    <div><label style="font-size:0.8rem; font-weight:600;">Categoría</label><select id="catProd" style="width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px;"><option>Congelados</option><option>Frescos</option><option>Secos</option><option>Menaje</option></select></div>
                    <button class="btn-primary" onclick="agregarProductoOficina()">Añadir</button>
                </div>
            </div>
            <div class="card">
                <h2>📋 Inventario Global y Analítica</h2>
                <table>
                    <thead><tr><th>Producto</th><th>Categoría</th><th>Estado</th><th>Veces Solicitado</th></tr></thead>
                    <tbody>${htmlTabla}</tbody>
                </table>
            </div>
        `;
    }

    function agregarProductoOficina() {
        let nombre = document.getElementById('nombreProd').value.trim();
        let cat = document.getElementById('catProd').value;
        if(!nombre) { alert("Escribe un nombre."); return; }

        let db = obtenerInventario();
        let id = db.length > 0 ? Math.max(...db.map(i => i.id)) + 1 : 1;
        db.push({ id, nombre, categoria: cat, estado: "OK", veces: 0 });

        guardarInventario(db, `Oficina añadió nuevo producto: "${nombre}"`);
    }

    // ESCUCHAR TIEMPO REAL ENTRE PESTAÑAS O DISPOSITIVOS SIN RECARGAR
    canalRT.onmessage = (e) => {
        cargarPanel();
        if(e.data.mensaje) mostrarToast(e.data.mensaje);
    };

    window.addEventListener('storage', () => {
        cargarPanel();
    });

    cargarPanel();
</script>
</body>
</html>
