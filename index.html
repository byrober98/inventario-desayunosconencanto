<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catering Pro - Acceso al Sistema</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 100%; border-top: 5px solid #0284c7; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }
        .btn { display: block; width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-decoration: none; transition: opacity 0.2s; }
        .btn-encargado { background: #0284c7; color: white; }
        .btn-jefe { background: #16a34a; color: white; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🍽️ Sistema de Catering</h1>
        <p>Selecciona tu panel de trabajo para acceder al inventario en tiempo real:</p>
        <a href="encargado.html" class="btn btn-encargado">📦 Panel de Encargado (Almacén)</a>
        <a href="jefe.html" class="btn btn-jefe">🏢 Panel de Oficina (Dirección)</a>
    </div>
</body>
</html>
